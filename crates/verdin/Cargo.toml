[package]
name = "verdin"
description = "Open source headless CMS written in Rust, compatible with Strapi v5 content APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = "1.1.10"
notify = "8.2.0"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
rust-embed = { version = "8.12.0", optional = true }
sentry = { version = "0.49.3", default-features = false, features = ["reqwest", "rustls", "panic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "cors", "limit", "util", "fs", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = "3.0.0"
verdin-api = { version = "0.10.0", path = "../verdin-api" }
verdin-auth = { version = "0.10.0", path = "../verdin-auth" }
verdin-content = { version = "0.10.0", path = "../verdin-content" }
verdin-db = { version = "0.10.0", path = "../verdin-db" }
verdin-email = { version = "0.10.0", path = "../verdin-email" }
verdin-graphql = { version = "0.10.0", path = "../verdin-graphql" }
verdin-migrate = { version = "0.10.0", path = "../verdin-migrate" }
verdin-plugins = { version = "0.10.0", path = "../verdin-plugins" }
verdin-query = { version = "0.10.0", path = "../verdin-query" }
verdin-schema = { version = "0.10.0", path = "../verdin-schema" }
verdin-search = { version = "0.10.0", path = "../verdin-search" }
verdin-upload = { version = "0.10.0", path = "../verdin-upload" }

[features]
# Embed the built admin panel (admin/dist/admin/browser) into the binary.
embed-admin = ["dep:rust-embed"]

[lints]
workspace = true

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# `cargo binstall verdin` downloads the archive that .github/workflows/release.yml
# publishes instead of compiling (Linux hosts get the static musl build).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/verdin-v{ version }-{ target }{ archive-suffix }"
bin-dir = "verdin-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# `cargo deb`: release.yml packages the musl binaries for amd64 and arm64. The package
# installs /usr/bin/verdin, /etc/verdin/verdin.toml, a `verdin` system user with its state
# in /var/lib/verdin, and a systemd unit that is not enabled. Files in deploy/deb/.
[package.metadata.deb]
maintainer = "Verdin maintainers <https://github.com/verdin-cms/verdin/issues>"
copyright = "Verdin contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
Open source headless CMS written in Rust, compatible with Strapi v5 content APIs: \
one binary with the admin panel built in, running on PostgreSQL, MySQL, MariaDB \
or SQLite."""
section = "web"
priority = "optional"
depends = "adduser"
recommends = "ca-certificates"
maintainer-scripts = "../../deploy/deb/"
conf-files = ["/etc/verdin/verdin.toml"]
assets = [
  ["target/release/verdin", "usr/bin/", "755"],
  ["../../deploy/deb/verdin.toml", "etc/verdin/", "644"],
  ["../../README.md", "usr/share/doc/verdin/", "644"],
]
systemd-units = { unit-name = "verdin", enable = false, start = false }

