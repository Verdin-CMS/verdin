[package]
name = "verdin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = "1.1.10"
notify = "8.2.0"
rust-embed = { version = "8.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "cors", "limit", "util", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = "3.0.0"
verdin-api = { version = "0.3.0", path = "../verdin-api" }
verdin-auth = { version = "0.3.0", path = "../verdin-auth" }
verdin-content = { version = "0.3.0", path = "../verdin-content" }
verdin-db = { version = "0.3.0", path = "../verdin-db" }
verdin-graphql = { version = "0.3.0", path = "../verdin-graphql" }
verdin-migrate = { version = "0.3.0", path = "../verdin-migrate" }
verdin-query = { version = "0.3.0", path = "../verdin-query" }
verdin-schema = { version = "0.3.0", path = "../verdin-schema" }
verdin-upload = { version = "0.3.0", path = "../verdin-upload" }

[features]
# Embed the built admin panel (admin/dist/admin/browser) into the binary.
embed-admin = ["dep:rust-embed"]

[lints]
workspace = true

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
http-body-util = "0.1.5"
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

