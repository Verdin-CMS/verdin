[package]
name = "verdin-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fancy-regex = "0.19.2"
indexmap = "2.14.2"
regex = "1.13.1"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = "0.3.55"
tracing = "0.1.44"
ulid = "3.0.0"
verdin-db = { version = "0.2.0", path = "../verdin-db" }
verdin-migrate = { version = "0.2.0", path = "../verdin-migrate" }
verdin-query = { version = "0.2.0", path = "../verdin-query" }
verdin-schema = { version = "0.2.0", path = "../verdin-schema" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
verdin-testkit = { path = "../verdin-testkit" }
