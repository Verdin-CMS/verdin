[package]
name = "verdin-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
num-bigint = "0.5.1"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tracing = "0.1.44"
verdin-db = { version = "0.9.1", path = "../verdin-db" }
verdin-migrate = { version = "0.9.1", path = "../verdin-migrate" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
verdin-migrate = { path = "../verdin-migrate" }
verdin-schema = { path = "../verdin-schema" }
verdin-testkit = { path = "../verdin-testkit" }
