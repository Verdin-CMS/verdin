[package]
name = "verdin-search"
description = "Full-text search for Verdin: a Tantivy index of document versions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tantivy = "0.26.2"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
verdin-content = { version = "0.8.0", path = "../verdin-content" }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
verdin-db = { version = "0.8.0", path = "../verdin-db" }
verdin-schema = { version = "0.8.0", path = "../verdin-schema" }

[lints]
workspace = true
