# A test plugin for verdin-plugins. Rebuild the committed `../sample.wasm` with:
#   cargo build --release --target wasm32-unknown-unknown && cp target/wasm32-unknown-unknown/release/sample.wasm ..
[package]
name = "sample"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the Verdin workspace.
[workspace]
