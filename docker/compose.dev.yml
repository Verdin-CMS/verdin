# Local database matrix for development and conformance tests.
#   docker compose -f docker/compose.dev.yml up -d
# Connection URLs:
#   postgres://verdin:verdin@localhost:5414/verdin   (PostgreSQL 14)
#   postgres://verdin:verdin@localhost:5417/verdin   (PostgreSQL 17)
#   mysql://verdin:verdin@localhost:3384/verdin      (MySQL 8.4)
#   mysql://verdin:verdin@localhost:3311/verdin      (MariaDB 10.11)
#   mysql://verdin:verdin@localhost:3314/verdin      (MariaDB 11.4)
# S3-compatible storage (RustFS) for the media library: http://localhost:9000, bucket
# `verdin` (create it with `docker compose -f docker/compose.dev.yml run --rm rustfs-bucket`),
# access key `verdin` / secret `verdin-secret`, console on :9001.
# Email (Mailpit): SMTP localhost:1025 (no TLS, no auth), inbox at http://localhost:8025.
# Integration tests create a database per test, so on MySQL/MariaDB they need
# root (password `verdin`): mysql://root:verdin@localhost:3384/verdin
name: verdin-dev

x-postgres: &postgres
  environment:
    POSTGRES_USER: verdin
    POSTGRES_PASSWORD: verdin
    POSTGRES_DB: verdin
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U verdin"]
    interval: 2s
    retries: 30

x-mariadb: &mariadb
  environment:
    MARIADB_USER: verdin
    MARIADB_PASSWORD: verdin
    MARIADB_DATABASE: verdin
    MARIADB_ROOT_PASSWORD: verdin
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 2s
    retries: 30

services:
  postgres14:
    <<: *postgres
    image: postgres:14-alpine
    ports: ["5414:5432"]

  postgres17:
    <<: *postgres
    image: postgres:17-alpine
    ports: ["5417:5432"]

  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_USER: verdin
      MYSQL_PASSWORD: verdin
      MYSQL_DATABASE: verdin
      MYSQL_ROOT_PASSWORD: verdin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pverdin"]
      interval: 2s
      retries: 30
    ports: ["3384:3306"]

  mariadb1011:
    <<: *mariadb
    image: mariadb:10.11
    ports: ["3311:3306"]

  mariadb114:
    <<: *mariadb
    image: mariadb:11.4
    ports: ["3314:3306"]

  # S3-compatible storage (RustFS) for the media library.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: verdin
      RUSTFS_SECRET_KEY: verdin-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]

  # SMTP sink for email tests: SMTP on :1025, web UI and API on :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # Creates the `verdin` bucket (run once: `docker compose … run --rm rustfs-bucket`).
  rustfs-bucket:
    image: amazon/aws-cli:latest
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: verdin
      AWS_SECRET_ACCESS_KEY: verdin-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "sleep 3; aws --endpoint-url http://rustfs:9000 s3 mb s3://verdin || aws --endpoint-url http://rustfs:9000 s3 ls s3://verdin"]
    profiles: [tools]
