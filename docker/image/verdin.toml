# Configuration baked into the Docker image. Override any key with
# VERDIN_<SECTION>__<KEY>, or mount your own file and set VERDIN_CONFIG.

[server]
host = "0.0.0.0"
port = 1337

[schema]
path = "/data/schema"

[log]
format = "json"

# Local uploads go to /data/uploads: /app/public/uploads (the default directory) links
# there, so switching to S3 takes environment variables only
# (VERDIN_UPLOAD__PROVIDER__NAME=s3, …).
[upload.transforms]
cache_dir = "/data/.cache/transforms"

[search]
dir = "/data/search"
