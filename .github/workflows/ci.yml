name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2

  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-latest
    env:
      VERDIN_TEST_DATABASE_URL: "sqlite::memory:"
      VERDIN_TEST_EXPECT_FLAVOR: sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres-14
            image: postgres:14-alpine
            port: "5432:5432"
            health: pg_isready -U verdin
            flavor: postgres
            url: postgres://verdin:verdin@localhost:5432/verdin
          - name: postgres-17
            image: postgres:17-alpine
            port: "5432:5432"
            health: pg_isready -U verdin
            flavor: postgres
            url: postgres://verdin:verdin@localhost:5432/verdin
          - name: mysql-8.4
            image: mysql:8.4
            port: "3306:3306"
            health: mysqladmin ping -h 127.0.0.1 -uroot -pverdin
            flavor: mysql
            url: mysql://root:verdin@127.0.0.1:3306/verdin
          - name: mariadb-10.11
            image: mariadb:10.11
            port: "3306:3306"
            health: healthcheck.sh --connect --innodb_initialized
            flavor: mariadb
            url: mysql://root:verdin@127.0.0.1:3306/verdin
          - name: mariadb-11.4
            image: mariadb:11.4
            port: "3306:3306"
            health: healthcheck.sh --connect --innodb_initialized
            flavor: mariadb
            url: mysql://root:verdin@127.0.0.1:3306/verdin
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}
        env:
          POSTGRES_USER: verdin
          POSTGRES_PASSWORD: verdin
          POSTGRES_DB: verdin
          MYSQL_USER: verdin
          MYSQL_PASSWORD: verdin
          MYSQL_DATABASE: verdin
          MYSQL_ROOT_PASSWORD: verdin
          MARIADB_USER: verdin
          MARIADB_PASSWORD: verdin
          MARIADB_DATABASE: verdin
          MARIADB_ROOT_PASSWORD: verdin
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      VERDIN_TEST_DATABASE_URL: ${{ matrix.url }}
      VERDIN_TEST_EXPECT_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  s3:
    name: test (s3 storage, RustFS)
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: verdin
          RUSTFS_SECRET_KEY: verdin-secret
    env:
      AWS_ACCESS_KEY_ID: verdin
      AWS_SECRET_ACCESS_KEY: verdin-secret
      AWS_DEFAULT_REGION: us-east-1
      VERDIN_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create the bucket
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url "$VERDIN_TEST_S3_ENDPOINT" s3 mb s3://verdin && break
            sleep 2
          done
      - run: cargo test -p verdin-upload --test s3

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx prettier --check "src/app/{core,features,layout,shared/components}/**/*.ts" "e2e/**/*.ts"
      - run: npm run i18n:check
      - run: npm audit --audit-level=high
      - run: npx ng test --watch=false
      - run: npx ng build
      # The server embeds the build it was compiled with.
      - run: cargo build -p verdin --features embed-admin
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
