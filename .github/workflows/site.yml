# Builds the documentation site (site/, with docs/*.md and CHANGELOG.md synced in) and
# publishes it to GitHub Pages on every push to main that touches it.
#
# The site goes to the root of the gh-pages branch; pull request previews live next to it
# under pr-preview/ (site-preview.yml, site-preview-deploy.yml), which this job keeps.
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a
# branch", branch gh-pages, folder / (the branch is created by the first run).
#
# Where the site is served is one repository variable, SITE_URL (default
# https://verdin-cms.github.io/verdin). For a custom domain set SITE_URL to e.g.
# https://docs.example.com and add the domain in the Pages settings; this job writes the
# matching CNAME file.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# One writer of the gh-pages branch at a time (shared with the preview workflows).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Last updated" dates come from the git history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Pages files
        run: |
          # Serve _astro/ and other underscore folders as they are (no Jekyll).
          touch site/dist/.nojekyll
          host="$(node -e 'console.log(new URL(process.env.SITE_URL || "https://x.github.io").host)')"
          case "$host" in
            *.github.io) ;;
            *) echo "$host" > site/dist/CNAME ;;
          esac
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/dist
          branch: gh-pages
          # Keep the pull request previews.
          clean-exclude: pr-preview/
          commit-message: "site: ${{ github.sha }}"
