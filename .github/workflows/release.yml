name: Release

# Pushing a tag such as v0.1.0 builds the binaries (admin panel embedded) and the .deb
# packages, publishes a GitHub release with checksums, pushes the multi-arch image to
# ghcr.io and publishes @verdin/client to npm (with an NPM_TOKEN secret). With their
# secrets, it also updates the Homebrew tap (HOMEBREW_TAP_TOKEN) and opens a winget pull
# request (WINGET_TOKEN); without them those jobs skip.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - uses: actions/upload-artifact@v7
        with:
          name: admin
          path: admin/dist/admin/browser

  binaries:
    name: build (${{ matrix.target }})
    needs: admin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: admin
          path: admin/dist/admin/browser
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (zig)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --release --locked -p verdin --features embed-admin --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p verdin --features embed-admin --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="verdin-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/verdin.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/verdin" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ env.ASSET }}

  deb:
    # Debian/Ubuntu packages of the musl binaries (cargo-deb metadata in
    # crates/verdin/Cargo.toml, maintainer scripts and systemd unit in deploy/deb/).
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*-linux-musl
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-deb
      - name: Package
        run: |
          mkdir debs
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p "target/$target/release"
            tar xzf "dist/verdin-${GITHUB_REF_NAME}-${target}.tar.gz" -C "target/$target/release" \
              --strip-components=1 "verdin-${GITHUB_REF_NAME}-${target}/verdin"
            cargo deb -p verdin --no-build --no-strip --target "$target" --output debs/
          done
          ls -l debs
      - uses: actions/upload-artifact@v7
        with:
          name: dist-deb
          path: debs/*.deb

  publish:
    needs: [binaries, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes
        # The section of CHANGELOG.md for this version.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  image:
    # Packages the musl binaries of `binaries` (built natively, admin embedded): no QEMU
    # compilation, so both architectures take seconds.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Lay out the binaries per platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; target="${pair##*:}-unknown-linux-musl"
            mkdir -p "docker/dist/$arch"
            tar xzf "dist/verdin-${GITHUB_REF_NAME}-${target}.tar.gz" -C "docker/dist/$arch" --strip-components=1
            chmod +x "docker/dist/$arch/verdin"
          done
          mkdir -p docker/dist/data/schema/content-types docker/dist/data/schema/components docker/dist/data/uploads
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    # Publishes @verdin/client when the repository has an NPM_TOKEN secret.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/client
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test && npm run build
      - name: Publish
        run: |
          test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}" \
            || { echo "packages/client/package.json does not match $GITHUB_REF_NAME"; exit 1; }
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "No NPM_TOKEN secret: skipping"; exit 0; fi
          npm publish --access public --provenance

  homebrew:
    # Updates Formula/verdin.rb in the verdin-cms/homebrew-tap repository (template:
    # deploy/homebrew/verdin.rb.in). Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained
    # token with contents: write on that repository. Skipped without it.
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'verdin-cms/homebrew-tap' }}
    steps:
      - name: Check the secret
        id: check
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret: skipping the Homebrew tap"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.skip != 'true'
        name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .
          deploy/render-template.sh deploy/homebrew/verdin.rb.in "$GITHUB_REF_NAME" SHA256SUMS > verdin.rb
      - if: steps.check.outputs.skip != 'true'
        name: Push to the tap
        run: |
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Formula
          cp verdin.rb tap/Formula/verdin.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/verdin.rb
          if git diff --cached --quiet; then echo "The formula is up to date"; exit 0; fi
          git commit -m "verdin ${GITHUB_REF_NAME#v}"
          git push

  winget:
    # Opens a pull request on microsoft/winget-pkgs with the manifests of
    # deploy/winget/*.yaml.in. Needs a WINGET_TOKEN secret: a classic token with the
    # public_repo scope of an account that has a fork of winget-pkgs. Skipped without it.
    needs: publish
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check the secret
        id: check
        shell: bash
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "No WINGET_TOKEN secret: skipping winget"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.skip != 'true'
        name: Render the manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .
          version="${GITHUB_REF_NAME#v}"
          out="manifests/v/VerdinCMS/Verdin/$version"
          mkdir -p "$out"
          for template in deploy/winget/*.yaml.in; do
            name="$(basename "$template" .in)"
            deploy/render-template.sh "$template" "$version" SHA256SUMS > "$out/$name"
          done
          echo "MANIFESTS=$out" >> "$GITHUB_ENV"
      - if: steps.check.outputs.skip != 'true'
        name: Submit
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: VerdinCMS.Verdin $($env:GITHUB_REF_NAME.TrimStart('v'))" $env:MANIFESTS
