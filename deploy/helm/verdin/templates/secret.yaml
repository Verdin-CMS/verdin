{{- include "verdin.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "verdin.fullname" . }}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $jwt := .Values.secrets.adminJwtSecret | default (get $previous "VERDIN_ADMIN_JWT_SECRET" | default "" | b64dec) | default (randAlphaNum 64) }}
{{- $pepper := .Values.secrets.tokenPepper | default (get $previous "VERDIN_TOKEN_PEPPER" | default "" | b64dec) | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "verdin.labels" . | nindent 4 }}
  annotations:
    # Keep the secrets if the release is uninstalled: a new pepper voids every API token.
    helm.sh/resource-policy: keep
type: Opaque
data:
  VERDIN_ADMIN_JWT_SECRET: {{ $jwt | b64enc | quote }}
  VERDIN_TOKEN_PEPPER: {{ $pepper | b64enc | quote }}
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  VERDIN_DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if and .Values.s3.enabled .Values.s3.accessKeyId (not .Values.s3.existingSecret) }}
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.metrics.enabled .Values.metrics.token }}
  VERDIN_METRICS_TOKEN: {{ .Values.metrics.token | b64enc | quote }}
  {{- end }}
{{- end }}
