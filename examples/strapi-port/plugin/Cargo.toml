# The `tienda` plugin: the custom code of a Strapi project, ported. See ../README.md.
# Build with `cargo build --release --target wasm32-unknown-unknown`, then install
# target/wasm32-unknown-unknown/release/tienda.wasm as plugins/tienda/plugin.wasm.
[package]
name = "tienda"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the Verdin workspace.
[workspace]
